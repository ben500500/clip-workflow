upstream backend_upstream {
    server backend:8080;
}

upstream autoclip_upstream {
    server autoclip:8000;
}

upstream minio_upstream {
    server minio:9000;
}

# log_format 只能出现在 http 上下文（不能放在 server 块内）；
# 且 nginx 主配置已内置 main，需改名避免重复定义
log_format clip_main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    server_name _;
    client_max_body_size 500M;
    charset utf-8;

    # ==================== 访问日志格式 ====================
    access_log /var/log/nginx/access.log clip_main;
    error_log /var/log/nginx/error.log warn;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== 前端静态文件 ====================
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================== Backend API 代理 ====================
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # 缓冲区配置
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # 禁止缓存API响应
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==================== AutoClip API 代理 ====================
    location /autoclip/ {
        rewrite ^/autoclip/(.*) /$1 break;
        proxy_pass http://autoclip_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==================== WebSocket 代理 ====================
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 禁用缓冲以支持实时通信
        proxy_buffering off;
        proxy_cache off;
    }

    # ==================== MinIO 代理 ====================
    location /minio/ {
        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # MinIO 需要禁用缓冲
        proxy_buffering off;
        proxy_request_buffering off;

        # MinIO 上传大小限制
        client_max_body_size 500M;
    }

    # ==================== 健康检查端点 ====================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ==================== 拒绝访问 .env 等敏感文件 ====================
    location ~ /\.(env|git|docker|venv) {
        deny all;
        return 403;
    }

    location ~* (\.env|\.git|\.svn|docker-compose\.yml|nginx\.conf) {
        deny all;
        return 403;
    }

    # ==================== 404 处理 ====================
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ==================== 502 处理 ====================
    error_page 502 /502.html;
    location = /502.html {
        internal;
    }
}