resolver 127.0.0.11 valid=10s ipv6=off;

# resolve 让 nginx 每次通过 Docker DNS 重新解析服务地址，
# backend 等容器重建后 IP 变化无需重启 nginx。
upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8080 resolve;
}

upstream autoclip_upstream {
    zone autoclip_upstream 64k;
    server autoclip:8000 resolve;
}

upstream minio_upstream {
    zone minio_upstream 64k;
    server minio:9000 resolve;
}

upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:80 resolve;
}

# log_format 只能出现在 http 上下文（不能放在 server 块内）；
# 且 nginx 主配置已内置 main，需改名避免重复定义
log_format clip_main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 80;
    # HTTPS（自签证书，2026-11-09）：浏览器只在 HTTPS/localhost 下允许申请桌面通知，
    # 内网无域名只能用自签——首次访问点「高级 → 继续前往」信任一次即可。
    # 80 与 443 并存（不强制跳转），老书签/脚本的 http 访问不受影响。
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/clip.crt;
    ssl_certificate_key /etc/nginx/certs/clip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    server_name _;
    client_max_body_size 500M;
    charset utf-8;

    # ==================== 访问日志格式 ====================
    access_log /var/log/nginx/access.log clip_main;
    error_log /var/log/nginx/error.log warn;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== 前端静态文件 ====================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 缓存静态资源
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ==================== Backend API 代理 ====================
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（大文件上传/后端存储到 MinIO 耗时较长，放宽避免 120s 被掐断）
        # 11-04 订正：**这份才是现网 163 实际生效的入口**（挂进 clip-nginx 的
        # conf.d/default.conf，`proxy_pass http://backend_upstream` 直连 backend:8080，
        # 不经过 clip-frontend 容器里 frontend/nginx.conf 那份 900s/1200s）。
        # 3600s 在最外层，比整条内层链（autoclip 600 < backend 900 < 浏览器 960 <
        # frontend/nginx.conf 1200）都长，符合"外层绝不比内层先到期"，不用收口；
        # 真正会掐人的是内层，排查长请求别从这台网关开始看。
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # 上传相关：禁用请求缓冲，让浏览器 onUploadProgress 真实反映
        # 端到端传输进度（否则 nginx 先缓存整个请求体，浏览器侧进度会
        # 在「发到 nginx」那一刻就到 100%，而真正的后端接收/存 MinIO 还在后面，
        # 观感就是「进度条没传完就消失了」）。与 /minio/ 段保持一致。
        proxy_request_buffering off;
        client_max_body_size 500M;

        # 响应侧缓冲保持开启即可（不影响上传进度）
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        # 禁止缓存API响应
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==================== AutoClip API 代理 ====================
    location /autoclip/ {
        rewrite ^/autoclip/(.*) /$1 break;
        proxy_pass http://autoclip_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
        proxy_busy_buffers_size 16k;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ==================== WebSocket 代理 ====================
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 长连接超时
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 禁用缓冲以支持实时通信
        proxy_buffering off;
        proxy_cache off;
    }

    # ==================== MinIO 代理 ====================
    location /minio/ {
        proxy_pass http://minio_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # MinIO 需要禁用缓冲
        proxy_buffering off;
        proxy_request_buffering off;

        # MinIO 上传大小限制
        client_max_body_size 500M;
    }

    # ==================== 健康检查端点 ====================
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ==================== 拒绝访问 .env 等敏感文件 ====================
    location ~ /\.(env|git|docker|venv) {
        deny all;
        return 403;
    }

    location ~* (\.env|\.git|\.svn|docker-compose\.yml|nginx\.conf) {
        deny all;
        return 403;
    }

    # ==================== 404 处理 ====================
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ==================== 502 处理 ====================
    error_page 502 /502.html;
    location = /502.html {
        internal;
    }
}

# ==================== MinIO（浏览器预签名直链，TLS）====================
# 页面走 HTTPS 后，http://192.168.1.163:9000 的预签名链接会被当"混合内容"拦掉
# （缩略图/预览/下载全废）。这里在同域名下开 9443 做 TLS 反代，
# 后端 MINIO_EXTERNAL_ENDPOINT=https://192.168.1.163:9443 用同一张证书签 URL。
# ⚠️ Host 必须用 $http_host（保留 :9443）——SigV4 签名是按这个 host 算的。
server {
    listen 9443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/clip.crt;
    ssl_certificate_key /etc/nginx/certs/clip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name _;
    client_max_body_size 500M;

    location / {
        proxy_pass http://minio_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
