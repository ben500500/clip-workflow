# =============================================================================
# Clip Workflow - GPU 加速 overlay 配置
#
# 用途：为需要 GPU 的服务（Ollama 画面理解 / Whisper ASR / slice-worker NVENC 编码）
#       透传宿主机 NVIDIA GPU。默认 docker-compose.yml 为纯 CPU 部署，不受本文件影响。
#
# 启用前提（部署机）：
#   1. 安装 NVIDIA 显卡驱动（本系统面向 RTX 2070 8G 等 NVIDIA 卡）
#   2. 安装 nvidia-container-toolkit 并配置 Docker runtime：
#        sudo apt install nvidia-container-toolkit
#        sudo nvidia-ctk runtime configure --runtime=docker
#        sudo systemctl restart docker
#   3. 确认 `docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi` 能正常列出 GPU
#
# 启用方式（覆盖默认配置）：
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# 无 GPU 的机器请勿加本文件（保持纯 CPU 部署即可）。
# =============================================================================

services:
  # ==================== Ollama（画面理解 GPU 加速） ====================
  # Ollama 内置 CUDA 支持，把宿主机 GPU 挂给容器即可让 MiniCPM-V 走 GPU。
  # 需配合 .env 中 FRAME_ANALYSIS_ENABLED=true 生效。
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==================== AutoClip（Whisper ASR GPU 加速） ====================
  # faster-whisper 走 NVIDIA GPU 需满足：
  #   1. 用 GPU 版镜像构建：docker build --build-arg ENABLE_CUDA=true -t clip-autoclip:latest ./autoclip
  #   2. .env 中配置 WHISPER_DEVICE=cuda、WHISPER_COMPUTE_TYPE=float16
  #   3. 本文件为 autoclip 透传 GPU
  autoclip:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ==================== slice-worker / slice-worker-2（NVENC 硬件编码） ====================
  # 切片 NVENC 编码（h264_nvenc/hevc_nvenc）需要 GPU。透传后 worker 心跳会上报
  # encoder_capabilities（如 ["h264_nvenc","hevc_nvenc"]），节点界面「硬件编码」列可见。
  # ffmpeg 由镜像内自编译版本提供（含 NVENC + libx264/x265 + libass），无需宿主机 ffmpeg。
  slice-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  slice-worker-2:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
