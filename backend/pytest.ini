# 本仓此前没有 pytest 配置文件（无 pytest.ini / pyproject.toml / setup.cfg），
# pytest 只能靠「向上找根」隐式推断 rootdir（实测落在 backend/，正确但依赖 cwd）。
# 这里显式固定：镜像内测试入口是 `cd /app && python -m pytest tests/`，
# 而 /app 就是本目录（backend/Dockerfile 的 WORKDIR /app + COPY . .）。
#
# 选择 pytest.ini 而不是 pyproject.toml / setup.cfg，理由：
#   1. 本仓 backend/ 是「应用目录」而非可分发 Python 包，没有 pyproject.toml；
#      为跑测试而新建一个可能与部署工具链交互的 pyproject.toml 风险更大。
#   2. setup.cfg 仅被 setuptools 生态使用，本仓不发布包，语义不符。
#   3. pytest.ini 优先级最高、只影响 pytest，零副作用，改动面最小。
[pytest]
testpaths = tests

# 不在此处声明 asyncio_mode / anyio 插件：本仓**故意**不引入 pytest-asyncio
# （见 issue #356 与 requirements.txt 注释）。既有 27 条 `async def` 用例
# 依赖缺失插件的失败，属另一个 issue 的范围，本次不动。
