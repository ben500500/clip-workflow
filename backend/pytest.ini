; pytest 配置 —— 只放"整套件级"的开关，业务断言不在这里。
;
; 为什么是 pytest.ini 而不是 pyproject.toml / setup.cfg：
;   backend 下没有任何 pyproject.toml / setup.cfg，也没有打包行为（用 requirements.txt + Dockerfile
;   部署），建 pyproject.toml 反而会引入一个"这个目录是可安装包"的错觉，且要额外写 [tool.pytest.ini_options]
;   段落。pytest.ini 是 pytest 优先级最高的配置文件（压过 pyproject.toml / tox.ini / setup.cfg），
;   且天然把 rootdir 钉在 backend/，与本仓"cd backend && python -m pytest tests/"的调用方式一致。
;
; 为什么 asyncio_mode = strict（而不是 auto）：
;   现有 async 用例（tests/unit/*.py、tests/test_lan_source_client.py）**全部**显式打了
;   `@pytest.mark.asyncio`；同时 tests/unit/test_remotion_mix.py、tests/integration/* 里的
;   大量普通同步 `def test_*` 内部自己用 asyncio.run()/AsyncMock 驱动协程。
;   auto 会把**所有**未标 marker 的 async 函数也塞进事件循环，等于放宽了"哪些用例需要 async 上下文"
;   的显式契约——这正是本 Issue 想补上的那层可观测性。strict 与既有标法 100% 兼容，且今后漏标 marker
;   的 async 用例会被显式跳过并给出提示（而不是静默不执行），符合"禁止静默 skip"的诉求。
[pytest]
; 收集范围/rootdir 钉死（合并自 PR #359）：镜像内入口是 `cd /app && python -m pytest tests/`，
; 显式写死 testpaths 免得依赖 cwd 的隐式推断。
testpaths = tests
asyncio_mode = strict
; 收紧未识别 marker 的告警：marker 拼错（例如 asyncio 写成 asyncio_mark）必须看得见，
; 否则会重演"写了用例却从来不跑"。已知的第三方 marker 在此登记。
filterwarnings =
    error::pytest.PytestUnknownMarkWarning
markers =
    asyncio: 该用例是协程，需要 pytest-asyncio 提供事件循环
