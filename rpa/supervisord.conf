[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x1024x24
autostart=true
autorestart=true
priority=10

[program:chromium]
command=chromium-browser --remote-debugging-port=9222 --no-sandbox --disable-dev-shm-usage --user-data-dir=/data/chrome-profiles
environment=DISPLAY=:99
autostart=true
autorestart=true
priority=20
startsecs=5

[program:celery]
command=python3 -m celery -A app.celery_app worker -Q publish -c 1 -l info
autostart=true
autorestart=true
priority=30
startsecs=10
stopsignal=TERM
stopwaitsecs=30
