[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x1024x24
autostart=true
autorestart=true
priority=10

[program:chromium]
command=/app/start_chromium.sh
environment=DISPLAY=:99
autostart=true
autorestart=true
priority=20
startsecs=5
stdout_logfile=/var/log/chromium.log
stderr_logfile=/var/log/chromium.err.log

# Chromium 127+ 强制远程调试只监听 127.0.0.1（忽略 --remote-debugging-address），
# 且同一端口无法同时绑 0.0.0.0 与 127.0.0.1，且 DevTools 有 Host 头 DNS-rebinding 校验。
# 方案：chromium 监听内部端口 9223（仅 127.0.0.1），
# cdp_proxy.py 监听 0.0.0.0:9222，改写 Host 头后转发到 127.0.0.1:9223，
# 使 backend/worker 可通过 docker 网络（rpa_worker:9222）做 CDP 连接。
[program:cdp_proxy]
command=python3 /app/cdp_proxy.py
stdout_logfile=/var/log/cdp_proxy.log
stderr_logfile=/var/log/cdp_proxy.err.log
autostart=true
autorestart=true
priority=25
startsecs=5
