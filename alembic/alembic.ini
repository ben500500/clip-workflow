# Alembic 数据库迁移配置
# Clip Workflow 使用 Alembic 管理 schema 版本，安全迭代数据库结构。

[alembic]
# 迁移脚本目录
script_location = alembic
# 数据库 URL 由 env.py 从应用配置动态读取，这里留空
sqlalchemy.url =

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
