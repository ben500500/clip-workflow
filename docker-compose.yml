version: "3.8"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

# 统一时区：所有容器与宿主机一致（Asia/Shanghai），避免日志/任务时间戳差 8 小时
x-common-env: &common-env
  TZ: Asia/Shanghai

networks:
  clip-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  media_data:
  chrome_profiles:
  slice_worker_temp:

services:
  # ==================== Database ====================
  postgres:
    image: postgres:15-alpine
    container_name: clip-postgres
    restart: unless-stopped
    networks:
      - clip-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB:-clipworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-clipworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipworkflow} -d ${POSTGRES_DB:-clipworkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: clip-redis
    restart: unless-stopped
    networks:
      - clip-network
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-16379}:6379"
    environment:
      <<: *common-env
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # ==================== MinIO ====================
  minio:
    image: minio/minio:latest
    container_name: clip-minio
    restart: unless-stopped
    networks:
      - clip-network
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # 仅创建 bucket，不再将 bucket 设为 public（敏感素材不应公开可读）
  minio_init:
    image: minio/mc:latest
    container_name: clip-minio-init
    restart: "no"
    networks:
      - clip-network
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: |
      /bin/sh -c "
        echo 'Waiting for MinIO...'
        mc alias set clip-minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
        mc mb clip-minio/${MINIO_BUCKET:-clipworkflow} --ignore-existing
        mc mb clip-minio/publish-screenshots --ignore-existing
        mc mb clip-minio/sliced --ignore-existing
        mc mb clip-minio/watermark-raw --ignore-existing
        mc mb clip-minio/watermark-output --ignore-existing
        echo 'MinIO bucket initialized successfully.'
      "
    logging: *default-logging

  # ==================== AutoClip Service ====================
  autoclip:
    build:
      context: ./autoclip
      dockerfile: Dockerfile
    image: clip-autoclip:latest
    container_name: clip-autoclip
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      API_MODEL_NAME: ${API_MODEL_NAME:-qwen-plus}
      DASHSCOPE_MODE: ${DASHSCOPE_MODE:-compatible}
      SERVICE_MODE: api
      # 本地 whisper 模型路径（避免每次容器重建从 HuggingFace 下载，国内网络不稳定）
      # 切换模型：改这里即可（旧模型保留在 ./whisper-model，新模型在 ./whisper-model-turbo）
      WHISPER_MODEL: /app/whisper-model-turbo
    ports:
      - "127.0.0.1:${AUTOCLIP_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      # faster-whisper 模型缓存持久化（HF_HOME=/app/.cache，避免容器重建后重新下载）
      - ./hf-cache:/app/.cache
      # 本地平铺模型目录（直接加载，不依赖 HuggingFace 下载）
      - ./whisper-model:/app/whisper-model:ro
      # turbo 模型（large-v3-turbo，更快更小，当前默认使用）
      - ./whisper-model-turbo:/app/whisper-model-turbo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # ==================== Backend Services ====================
  alembic-migrate:
    image: clip-backend:latest
    container_name: clip-alembic
    restart: "no"
    networks:
      - clip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clipworkflow}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipworkflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./alembic:/app/alembic:ro
    working_dir: /app
    command: ["sh", "-c", "alembic -c alembic/alembic.ini upgrade head || echo 'Alembic 迁移跳过（已存在表结构或首次部署由 ORM create_all 建表）'"]
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: clip-backend:latest
    container_name: clip-backend
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      alembic-migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clipworkflow}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipworkflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-clipworkflow}
      # 浏览器可访问的 MinIO 地址（presigned URL 用该地址替换容器内 host，修复预览/下载拒绝连接）
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      CHROME_DEBUG_PORT: 9222
      CHROME_DEBUG_HOST: rpa_worker
      RPA_REQUIRE_MANUAL_CONFIRM: "true"
      # HuggingFace 离线模式：去水印 ONNX 模型从本地预置缓存加载（hf-cache），
      # 禁止检查远程（服务器无法访问 huggingface.co，检查会阻塞超时）
      HF_HUB_OFFLINE: "1"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1"]
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8080"
    volumes:
      - media_data:/app/media
      - chrome_profiles:/data/chrome-profiles
      - ./engines:/app/engines:ro
      # HuggingFace 模型缓存持久化（LaMa/MI-GAN 去水印 ONNX 模型，离线环境预置）
      - ./hf-cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  worker:
    image: clip-backend:latest
    container_name: clip-worker
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clipworkflow}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipworkflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-clipworkflow}
      # 浏览器可访问的 MinIO 地址（presigned URL 用该地址替换容器内 host，修复预览/下载拒绝连接）
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT:-localhost:9000}
      CHROME_DEBUG_PORT: 9222
      CHROME_DEBUG_HOST: rpa_worker
      # HuggingFace 离线模式：去水印 ONNX 模型从本地预置缓存加载（hf-cache），
      # 禁止检查远程（服务器无法访问 huggingface.co，检查会阻塞超时）
      HF_HUB_OFFLINE: "1"
    volumes:
      - media_data:/app/media
      - ./engines:/app/engines:ro
      # HuggingFace 模型缓存持久化（LaMa/MI-GAN 去水印 ONNX 模型，离线环境预置）
      - ./hf-cache:/app/.cache
    command: ["celery", "-A", "app.celery.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    # celery worker 无 HTTP 端口，用 python redis ping 作为健康检查（覆盖镜像默认的 curl 检查）
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,sys; sys.exit(0 if redis.Redis(host='redis',port=6379,password='${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}').ping() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  beat:
    image: clip-backend:latest
    container_name: clip-beat
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clipworkflow}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipworkflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-clipworkflow}
    command: ["celery", "-A", "app.celery.tasks.celery_app", "beat", "--loglevel=info"]
    # celery beat 无 HTTP 端口，用 python redis ping 作为健康检查（覆盖镜像默认的 curl 检查）
    healthcheck:
      test: ["CMD", "python", "-c", "import redis,sys; sys.exit(0 if redis.Redis(host='redis',port=6379,password='${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}').ping() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ==================== RPA Worker (Playwright) ====================
  rpa_worker:
    build:
      context: ./rpa
      dockerfile: Dockerfile
    image: clip-rpa:latest
    container_name: clip-rpa-worker
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-clipworkflow}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipworkflow}
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在 .env 中设置 MINIO_ROOT_PASSWORD}
      CHROME_DEBUG_PORT: 9222
      DISPLAY: :99
    volumes:
      - chrome_profiles:/data/chrome-profiles
      - media_data:/app/media
    ports:
      - "127.0.0.1:${RPA_DEBUG_PORT:-9222}:9222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9222/json/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ==================== Slice Worker (Go) ====================
  slice-worker:
    build:
      context: ./slice-worker
      dockerfile: Dockerfile
    image: clip-slice-worker:latest
    container_name: clip-slice-worker
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *common-env
      NODE_ID: slice-worker-1
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      MAX_CONCURRENT: "2"
      CPU_PERCENT: ${CPU_PERCENT:-50}
      HEARTBEAT_INTERVAL: "10"
      LOG_LEVEL: info
      TASK_TIMEOUT: "7200"
      MAX_RETRIES: "2"
      RETRY_DELAY: "30"
      NODE_TTL: "0"
      BACKEND_URL: ${WORKER_CALLBACK_BASE_URL:-http://backend:8080}
    volumes:
      - ./engines:/app/engines:ro
      - slice_worker_temp:/tmp/slice-worker
    logging: *default-logging

  # ==================== Slice Worker 节点 2（同机扩容） ====================
  slice-worker-2:
    build:
      context: ./slice-worker
      dockerfile: Dockerfile
    image: clip-slice-worker:latest
    container_name: clip-slice-worker-2
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      <<: *common-env
      NODE_ID: slice-worker-2
      REDIS_URL: redis://:${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}@redis:6379/0
      MAX_CONCURRENT: "2"
      CPU_PERCENT: ${CPU_PERCENT:-50}
      HEARTBEAT_INTERVAL: "10"
      LOG_LEVEL: info
      TASK_TIMEOUT: "7200"
      MAX_RETRIES: "2"
      RETRY_DELAY: "30"
      NODE_TTL: "0"
      BACKEND_URL: ${WORKER_CALLBACK_BASE_URL:-http://backend:8080}
    volumes:
      - ./engines:/app/engines:ro
      - slice_worker_temp:/tmp/slice-worker
    logging: *default-logging

  # ==================== Frontend ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: clip-frontend:latest
    container_name: clip-frontend
    restart: unless-stopped
    networks:
      - clip-network
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *common-env
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    logging: *default-logging

  # ==================== Nginx ====================
  nginx:
    image: nginx:1.28-alpine
    container_name: clip-nginx
    restart: unless-stopped
    networks:
      - clip-network
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      <<: *common-env
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      autoclip:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
