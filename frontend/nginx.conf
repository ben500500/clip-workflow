server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 素材库出文案/投产是"点一下同步等模型"的长请求：11-04 预览栈实测
        # mimo-v2.6-pro 96.2s / mimo-v2.6-flash 93.6s 正常回，网关卡流时单次要跑到 600s。
        # 300s 会让 nginx 先 504、而后端其实还在等模型——用户看到"失败"，候选却已经落库。
        # 口径必须**从内到外严格递增**，任何两层同值等于掷硬币（谁先到期看调度）。
        # 现在这条链：autoclip 单次 API_TIMEOUT=600 < backend _call_autoclip=900
        # < 浏览器 MODEL_WAIT_TIMEOUT=960（frontend/src/api/assets.ts）< 本块 1200。
        # 11-04 第二轮审核订正：本块原来写 900s 还注释"与后端同口径"，同值就是上面说的掷硬币；
        # 而且**现网 163 的 /api/ 根本不走这份文件**——生产入口是仓库根 nginx.conf 挂进
        # clip-nginx 的 :75 location（读超时 3600s，proxy_pass 直连 backend:8080，
        # 绕过本容器）。这份只在预览栈/直连 clip-frontend 时生效，别拿它当现网口径。
        # 11-04 批 C（D-1）后适用面收窄：出文案/投产的页面按钮改成提交即回任务号＋轮询，
        # 模型不再挂在一个 HTTP 请求上；本块的 1200s 仍需留给反推(analyze)、收敛在跑结果
        # (refresh-batch)、按需解析(resolve) 和同步形态（脚本/手工）——别因为"异步了"就调小。
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 /assets（素材库）和 Vite 产物目录 dist/assets 撞名：
    # 裸 /assets 会先进下面的 location / ，被 try_files 的 $uri/ 匹配到那个**目录**
    # → nginx 回 301 /assets/ → 目录里没有 index.html 且 autoindex off → 403。
    # 站内点菜单是纯前端跳转不受影响，但直接输网址或按刷新就会 403。
    # `=` 精确匹配优先级最高，只把这一条交回 index.html，带斜杠的静态请求仍走上面那块。
    location = /assets {
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}