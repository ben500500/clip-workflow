server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 /assets（素材库）和 Vite 产物目录 dist/assets 撞名：
    # 裸 /assets 会先进下面的 location / ，被 try_files 的 $uri/ 匹配到那个**目录**
    # → nginx 回 301 /assets/ → 目录里没有 index.html 且 autoindex off → 403。
    # 站内点菜单是纯前端跳转不受影响，但直接输网址或按刷新就会 403。
    # `=` 精确匹配优先级最高，只把这一条交回 index.html，带斜杠的静态请求仍走上面那块。
    location = /assets {
        try_files /index.html =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}