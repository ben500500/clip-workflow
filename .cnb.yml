# .cnb.yml — CNB 云原生构建配置
#
# 功能1：打 vXX tag 后自动构建全部 5 个 Docker 镜像并推送到 CNB Docker 制品库
# 功能2：push/PR 时运行源字幕打码回归测试（自动/精细/快速三档预设 + 打码区≤9%屏高 + 文字密度≥60%）
#
# 版本号从 tag 中获取（如 v1.0.0 → 1.0.0），同时打 latest 标签
#
# 触发方式（构建镜像）：
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 制品地址：
#   docker.cnb.cool/ben500500/clip-workflow/<image-name>:<version>
#
# 拉取镜像（部署时）：
#   docker pull docker.cnb.cool/ben500500/clip-workflow/clip-backend:1.0.0

# 源字幕打码回归测试：验收指标为 动态打码区≤9%屏高、源字幕文字密度下降≥60%
# （见 PR #148 讨论结论）。测试脚本在 engines/tests/test_subtitle_mask_regression.py，
# 依赖 ffmpeg/opencv/numpy 由 engines/tests/Dockerfile 预装，缺依赖时脚本自动跳过（不误报失败）。
.subtitle-mask-test:
  &subtitle-mask-test
  name: subtitle-mask-regression
  runner:
    cpus: 2
  docker:
    build:
      dockerfile: ./engines/tests/Dockerfile
      by: [engines/tests/Dockerfile, engines/tests/test_subtitle_mask_regression.py, engines/slice.py]
  stages:
    - name: run regression test
      script: python3 engines/tests/test_subtitle_mask_regression.py

main:
  push:
    - *subtitle-mask-test
  pull_request:
    - *subtitle-mask-test

$:
  tag_push:
    # ==================== clip-backend ====================
    # 后端主服务（FastAPI + Celery），backend/worker/beat 共用此镜像
    - name: build-backend
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push
          script: |
            VERSION="${CNB_BRANCH#v}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/clip-backend"
            echo "Building $IMAGE:$VERSION (from tag $CNB_BRANCH)"
            # alembic/ 在仓库根（与 backend/ 平级），构建前拷进 backend/ 作为 Docker context 的一部分
            # （Dockerfile 的 COPY . . 会带上 → 镜像内 /app/alembic；rm -rf 防重跑嵌套）
            rm -rf backend/alembic && cp -r alembic backend/alembic
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./backend
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"

    # ==================== clip-frontend ====================
    # 前端静态资源（Vite + React → Nginx）
    - name: build-frontend
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push
          script: |
            VERSION="${CNB_BRANCH#v}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/clip-frontend"
            echo "Building $IMAGE:$VERSION (from tag $CNB_BRANCH)"
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./frontend
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"

    # ==================== clip-autoclip ====================
    # AI 智能选点服务（通义千问 ASR + LLM）
    - name: build-autoclip
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push
          script: |
            VERSION="${CNB_BRANCH#v}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/clip-autoclip"
            echo "Building $IMAGE:$VERSION (from tag $CNB_BRANCH)"
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./autoclip
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"

    # ==================== clip-rpa ====================
    # RPA 浏览器宿主（Playwright + Chromium + Xvfb）
    - name: build-rpa
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push
          script: |
            VERSION="${CNB_BRANCH#v}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/clip-rpa"
            echo "Building $IMAGE:$VERSION (from tag $CNB_BRANCH)"
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./rpa
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"

    # ==================== clip-slice-worker ====================
    # 分布式切片 Worker（Go + FFmpeg）
    - name: build-slice-worker
      runner:
        cpus: 4
      services:
        - docker
      stages:
        - name: build & push
          script: |
            VERSION="${CNB_BRANCH#v}"
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/clip-slice-worker"
            echo "Building $IMAGE:$VERSION (from tag $CNB_BRANCH)"
            # engines/ 在 slice-worker context 之外，先拷进去才能打入镜像
            bash scripts/sync-engines-to-worker.sh
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" ./slice-worker
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"

  # ==================== NPC：@ben500500/clip-workflow(代码审查员) 代码评审 ====================
  # 在 PR 评论中提及该 NPC 即触发 PR 代码评审（角色定义见 .cnb/settings.yml）。
  # 流程：先装 graft CLI 并现场重建代码地图（标准版零 LLM、零费用）→ 再让 CodeBuddy 按
  # AGENTS.md / 系统提示词 先查 graft 再读源码，带全仓调用边审 PR diff。
  pull_request.comment@npc:
    - docker:
        image: cnbcool/default-npc:latest
      stages:
        - name: 准备 graft 代码地图
          script: |
            set -e
            echo "=== 1/4 安装构建工具（graft 依赖 tree-sitter 原生绑定，需要 python3/make/g++）==="
            (apt-get update -qq 2>&1 | tail -1; apt-get install -y -qq python3 make g++ 2>&1 | tail -2) \
              || echo "(apt 不可用，尝试直接装 graft，若原生编译失败会显式报错)"
            echo "=== 2/4 安装 graft CLI（官方源，规避国内镜像缺 tree-sitter-wasm）==="
            npm install -g @nanonets/graft --registry=https://registry.npmjs.org --allow-scripts 2>&1 | tail -4
            echo "=== 3/4 校验 graft ==="
            graft --version || { echo "!! graft 安装失败"; exit 1; }
            echo "=== 4/4 现场重建 graft 代码地图（标准版零 LLM/零费用）==="
            graft build . 2>&1 | tail -6
            graft map 2>&1 | head -4
            echo "=== 5/5 预计算本次 PR 改动符号的 graft 调用链（强绑定）==="
            CTX="${CNB_BUILD_WORKSPACE:-/workspace}/review-context.md"
            {
              echo "# 本次 PR 改动符号的 graft 调用链（评审必须以此为准核查破坏面）"
              echo ""
              echo "- PR: #${CNB_PULL_REQUEST_IID:-?}"
              echo "- 源分支: ${CNB_PULL_REQUEST_BRANCH:-?}"
              echo "- base SHA: ${CNB_PULL_REQUEST_TARGET_SHA:-unknown}"
              echo "- head SHA: ${CNB_PULL_REQUEST_SHA:-unknown}"
              echo ""
            } > "$CTX"
            # 定位 base/head SHA（优先环境变量，回退 git 推导）
            BASE_SHA="${CNB_PULL_REQUEST_TARGET_SHA:-}"
            HEAD_SHA="${CNB_PULL_REQUEST_SHA:-}"
            [ -z "$HEAD_SHA" ] && HEAD_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
            if [ -z "$BASE_SHA" ]; then
              for ref in "origin/${CNB_DEFAULT_BRANCH:-main}" "${CNB_DEFAULT_BRANCH:-main}" origin/main main; do
                BASE_SHA="$(git merge-base HEAD "$ref" 2>/dev/null || true)"
                [ -n "$BASE_SHA" ] && break
              done
            fi
            [ -z "$BASE_SHA" ] && BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || true)"
            echo "  base=$BASE_SHA head=$HEAD_SHA"
            # CNB 只 clone 触发分支，PR 另一端的 commit 通常不在本地 → 先 fetch 再 diff
            for ref in "${CNB_PULL_REQUEST_BRANCH:-}" "${CNB_DEFAULT_BRANCH:-main}"; do
              [ -n "$ref" ] && git fetch -q origin "$ref" 2>/dev/null || true
            done
            # 改动源码文件（graft 可解析的 py/ts/tsx/js/go）
            CHANGED_FILES="$(git diff --name-only "${BASE_SHA:-HEAD~1}...${HEAD_SHA:-HEAD}" 2>/dev/null | grep -E '\.(py|ts|tsx|js|go)$' || true)"
            N_CHANGED="$(printf '%s\n' "$CHANGED_FILES" | grep -c . 2>/dev/null || echo 0)"
            echo "  改动源码文件数: $N_CHANGED"
            for f in $CHANGED_FILES; do
              [ -f "$f" ] || continue
              SYMS="$(git diff -U0 "${BASE_SHA:-HEAD~1}...${HEAD_SHA:-HEAD}" -- "$f" 2>/dev/null | \
                grep -E '^\+' | grep -vE '^\+\+\+' | \
                grep -oE '(def|class|func|function|const|let|var|type|interface|struct) [A-Za-z_][A-Za-z0-9_]*' | \
                awk '{print $2}' | sort -u)"
              if [ -n "$SYMS" ]; then
                {
                  echo ""
                  echo "## $f"
                  for s in $SYMS; do
                    echo "### graft callers $s --depth 2"
                    graft callers "$s" --depth 2 2>/dev/null | grep -v '^\[graft\] tokens saved' \
                      || echo "(图中未找到符号 $s)"
                  done
                } >> "$CTX"
              fi
            done
            echo "=== 调用链上下文生成完毕: $(wc -c < "$CTX") bytes ==="
            echo "=== graft 就绪 ==="
        - name: 代码评审
          type: npc:go
          options:
            role: 代码审查员
            systemPrompt: |
              你是本仓库资深代码审查员。评审前必须先做这一步（强制）：
              读取仓库根目录的 review-context.md —— 它由流水线预生成，包含本次 PR 改动符号的
              graft 调用链（graft callers --depth 2 的输出）。以它为准核查每个改动符号的调用方和
              破坏面；如需更深遍历再补跑 graft callers <符号> --depth 2。
              禁止跳过 graft 上下文直接凭感觉审。每条意见必须带 file:line 和具体修改建议，
              按 🔴严重 / 🟡建议 / 🟢小问题 分组；不写空话，核查后没问题就明确说"未发现严重问题"。
            userPrompt: |
              审查本次 PR 的代码变更。先读 review-context.md（改动符号的 graft 调用链），
              再结合 diff 判断破坏面，重点检查有没有被 PR 遗漏的调用方。
