# ============================================================
# 本地轻量部署 override（Mac + colima）
# 用法：docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# 与生产差异：
#   1. autoclip 去掉 ollama 依赖（本地不跑画面理解，FRAME_ANALYSIS_ENABLED=false）
#   2. 跳过重服务：ollama(1.6G 模型)、rpa_worker(内置 Chrome 一键发布)、slice-worker-2(副本)
#   3. ASR 走 aliyun_speech（DASHSCOPE_API_KEY 已有），不依赖本地 whisper 模型
# ============================================================
services:
  # alembic 迁移：本地主 compose 缺 ./alembic 挂载（服务器有手动修改未回传 git），
  # 这里补齐挂载 + 兜底命令，保证迁移执行成功
  alembic-migrate:
    volumes:
      - ./alembic:/app/alembic:ro
    command: ["sh", "-c", "alembic -c alembic/alembic.ini upgrade head || echo 'Alembic 迁移跳过（已存在表结构或首次部署由 ORM create_all 建表）'"]

  autoclip:
    # !override 强制替换 depends_on（compose 深合并覆盖不掉 ollama）
    depends_on: !override
      redis:
        condition: service_healthy

  # 本地不启动的服务（profiles 隔离，避免误起）
  ollama:
    profiles: ["never-in-local"]

  rpa_worker:
    profiles: ["never-in-local"]

  slice-worker-2:
    profiles: ["never-in-local"]

  # ============================================================
  # 2026-11-21 本地部署：剥离 163 专属宿主挂载（/home/cc12703/*）
  # backend + 全部 celery worker 的 volumes 用 !override 重建，保留通用挂载
  # ============================================================
  backend:
    volumes: !override
      - media_data:/app/media
      - chrome_profiles:/data/chrome-profiles
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-video:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-publish:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-variant:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-remotion:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-selection:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-wechat-dl:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
  worker-fast:
    volumes: !override
      - media_data:/app/media
      - ./engines:/app/engines:ro
      - ./hf-cache:/app/.cache
      - dedupe_upload_data:/tmp/dedupe_upload
